name: Bug report
description: Report incorrect behavior. Do not include enterprise data, tokens, or security exploit details.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic Demo data where possible. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `npm run dev`
        2. Open ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Data mode
      options:
        - Demo
        - Live GitHub Enterprise Cloud connection
        - Imported CSV
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node.js version, browser, gh/copilot CLI versions if relevant
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove enterprise names, user IDs, URLs, and tokens before posting.
